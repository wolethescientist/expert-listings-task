services:
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://listings:listings@db:5432/listings
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listings
      POSTGRES_PASSWORD: listings
      POSTGRES_DB: listings
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listings -d listings"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - listings_data:/var/lib/postgresql/data

  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listings
      POSTGRES_PASSWORD: listings
      POSTGRES_DB: listings_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listings -d listings_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - listings_test_data:/var/lib/postgresql/data

volumes:
  listings_data:
  listings_test_data:
